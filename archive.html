<!-- 마크다운(.md) 문법을 화면에서 해석해주는 도구 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{
    /* 포트폴리오 첫 화면과 같은 팔레트입니다. 색은 강조에만 쓰고 바탕은 아이보리로 둡니다. */
    --bg:#F5F1EB;--bg-soft:#EFEAE2;--card:#FFFDFA;--card-hover:#FFFFFF;--border:#E4DDD3;--border-strong:#D3C8B9;
    --text:#1C1A19;--muted:#6B625A;--faint:#9A9188;
    --accent:#D8662F;--accent-2:#E4A23A;--accent-deep:#9F3F2F;--accent-soft:rgba(216,102,47,.10);--accent-soft2:rgba(216,102,47,.15);
    --green:#5E7B4F;--green-soft:rgba(94,123,79,.14);--amber:#B5762A;--amber-soft:rgba(181,118,42,.15);
    --serif:"Noto Serif KR",serif;
    /* 1면과 같은 무드 — 각진 모서리, 그림자 없이 얇은 테두리로만 층위를 만듭니다 */
    --radius:3px;--maxw:1120px;--shadow:none;--shadow-hover:none;

    /* ---- 간격 체계 (4px 단위) ----
       임의의 값을 쓰지 않고 아래 8단계 안에서만 고릅니다.
       같은 계층의 요소에는 반드시 같은 값을 씁니다. */
    --s1:4px;  --s2:8px;  --s3:12px; --s4:16px;
    --s5:20px; --s6:24px; --s7:32px; --s8:40px;
    --gut:20px;              /* 칼럼 안여백 — 좌우 동일. 세로 구분선과의 거리 */

    /* ---- 선 체계 (4종) ----
       역할이 다른 선만 남기고, 굵기·색을 이 네 개로 통일합니다. */
    --rule-page:3px solid var(--text);              /* 페이지 최상단 (제호 아래) */
    --rule-strong:1px solid rgba(28,26,25,.55);     /* 강조 섹션 상·하단 */
    --rule-col:1px solid rgba(28,26,25,.20);        /* 칼럼 세로 구분선 */
    --rule-col-c:rgba(28,26,25,.20);                /* 위와 같은 색 — 막대로 그릴 때 씁니다 */
    --rule-inset:0.7cm;                             /* 칼럼 세로 구분선을 위아래로 띄우는 거리 */
    --rule-inset-sm:0.2cm;                          /* 작은 상자(PICK) 안 세로선용 */
    --rule-item:1px solid rgba(28,26,25,.13);       /* 기사와 기사 사이 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(900px 480px at 88% -160px,rgba(228,162,58,.13) 0%,rgba(228,162,58,0) 60%),
      radial-gradient(1000px 520px at 8% -220px,rgba(240,216,203,.55) 0%,rgba(240,216,203,0) 62%),
      var(--bg);
    color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

  /* ---------- 얇은 고정 줄 ----------
     평소에는 화면 위로 숨어 있다가, 제호가 위로 올라가면 내려옵니다.
     position:fixed 라 자리를 차지하지 않으므로 본문 위치는 그대로입니다. */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:30;
    background:rgba(245,241,235,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--text);
    transform:translateY(-100%);transition:transform .26s cubic-bezier(.22,.7,.3,1)}
  #topbar.show{transform:none}
  /* 제호가 없는 화면에서는 얇은 줄이 늘 떠 있으므로 그만큼 위를 비워 둡니다 */
  body.no-mh #app{padding-top:calc(56px + var(--s3))}
  @media(max-width:600px){ body.no-mh #app{padding-top:calc(50px + var(--s3))} }
  #topbar .nav{display:flex;align-items:center;gap:var(--s5);height:56px;padding:0 24px}
  #topbar .brand{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
  #topbar .tb-nav{display:flex;gap:var(--s5);margin-left:auto;flex-wrap:nowrap}
  #topbar .tb-nav a{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;transition:color .15s}
  #topbar .tb-nav a:hover,#topbar .tb-nav a.active{color:var(--accent)}
  @media(max-width:600px){
    #topbar .nav{height:50px;padding:0 20px;gap:var(--s3)}
    #topbar .brand{font-size:14.5px}
    #topbar .tb-nav{gap:var(--s3)}
    #topbar .tb-nav a{font-size:12px}
    .hero h1 .hbr{display:inline}
  }

  /* ---------- hero ---------- */
  .hero{position:relative;padding:56px 0 26px}
  .hero .hcopy{position:relative;z-index:2;max-width:720px}
  .hero .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.02em;
    color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:2px;margin-bottom:16px}
  .hero .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(216,102,47,.5);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(216,102,47,.45)}70%{box-shadow:0 0 0 8px rgba(216,102,47,0)}100%{box-shadow:0 0 0 0 rgba(216,102,47,0)}}
  .hero h1{font-family:var(--serif);font-size:35px;font-weight:600;letter-spacing:-.03em;line-height:1.3}
  .hero h1 .hl{background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero h1 .hbr{display:none}
  .hero p{color:var(--muted);margin-top:14px;font-size:16px;max-width:560px}
  .hero .meta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
  .hero .meta .chip{display:inline-flex;align-items:baseline;gap:6px;background:var(--card);border:1px solid var(--border);
    border-radius:2px;padding:9px 14px;font-size:13px;color:var(--muted)}
  .hero .meta .chip b{font-size:18px;font-weight:600;color:var(--text);letter-spacing:-.02em;font-family:var(--serif)}

  @media(prefers-reduced-motion:reduce){.hero .eyebrow .dot{animation:none!important}}

  /* ---------- sections ---------- */
  .sec-head{display:flex;align-items:baseline;gap:12px;margin:40px 0 18px}
  .sec-head h2{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.025em}
  .sec-head span{color:var(--faint);font-size:13px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  @media(max-width:1040px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}

  /* ---------- cards ---------- */
  .card{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;
    transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s,border-color .2s;display:flex;flex-direction:column;gap:10px;
    box-shadow:var(--shadow);opacity:0;transform:translateY(10px);animation:cardIn .5s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes cardIn{to{opacity:1;transform:translateY(0)}}
  .card:hover{border-color:var(--text);background:var(--card);transform:none}
  .card .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:2px;background:var(--accent-soft2);color:var(--accent);letter-spacing:.01em}
  .tag.g{background:var(--green-soft);color:var(--green)}
  .tag.a{background:var(--amber-soft);color:var(--amber)}
  /* 주제(Topic) 배지 색 — 노션 Topic 열의 색과 맞췄습니다 */
  .tag.tp-blue{background:rgba(75,110,117,.14);color:#41626B}
  .tag.tp-orange{background:rgba(192,100,42,.14);color:#B05A24}
  .tag.tp-gray{background:rgba(107,98,90,.13);color:#6B625A}
  .tag.tp-yellow{background:rgba(168,128,30,.16);color:#8A6718}
  .tag.tp-pink{background:rgba(168,86,112,.14);color:#9A4C64}
  .tag.tp-purple{background:rgba(122,91,138,.14);color:#6E507D}
  .tag.tp-red{background:rgba(168,66,47,.13);color:#9F3F2F}
  .tag.tp-green{background:rgba(94,123,79,.14);color:#546F47}
  .tag.tp-brown{background:rgba(139,94,60,.15);color:#7E5433}
  .card h3{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-.018em;line-height:1.5;transition:color .15s;
           display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card:hover h3{color:var(--accent)}
  .card .excerpt{color:var(--muted);font-size:13.5px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  /* 작성자 이름·날짜는 한 덩어리로 묶여 절대 쪼개지지 않고,
     주제 배지는 자리가 모자라면 통째로 아랫줄로 내려갑니다(글자 잘림 없음) */
  .card .foot{display:flex;align-items:center;flex-wrap:wrap;gap:7px 6px;margin-top:auto;padding-top:6px;
    font-size:13px;color:var(--faint);min-width:0}
  .avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;position:relative;overflow:hidden;flex:0 0 auto}
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
  .card .foot .byline,.feat-body .foot .byline{display:inline-flex;align-items:center;gap:6px;
    white-space:nowrap;flex:0 0 auto;min-width:0}
  .card .foot .who,.feat-body .foot .who{color:var(--muted);font-weight:700;white-space:nowrap}

  .week-block{margin-bottom:34px}
  .week-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:2px;margin-bottom:14px}
  .tag.tlink{cursor:pointer;transition:.15s}
  .tag.tlink:hover{filter:brightness(.92)}
  .authors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  @media(max-width:1040px){.authors{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:640px){.authors{grid-template-columns:repeat(2,1fr)}}
  .author-card{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;
    transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:var(--shadow)}
  .author-card:hover{transform:translateY(-4px);border-color:var(--border-strong);box-shadow:var(--shadow-hover)}
  .author-card .avatar{width:48px;height:48px;font-size:18px;margin:0 auto 11px}
  .author-card .nm{font-weight:800;font-size:15px}
  .author-card .ct{color:var(--faint);font-size:12.5px;margin-top:3px;font-weight:600}
  .author-card .abio{color:var(--muted);font-size:12.5px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border);line-height:1.55}
  .hero .abio-lg{margin-top:8px;color:var(--accent);font-size:14.5px;font-weight:700}
  .hero .about-lg{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.75;max-width:640px;white-space:pre-wrap}
  .count-pill{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:5px 11px;border-radius:2px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
  .hero h1 .a-count{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:0;line-height:1;white-space:nowrap}

  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:700;margin:28px 0 8px;cursor:pointer;transition:.15s}
  .back:hover{color:var(--accent);gap:9px}
  .article{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:34px;margin-top:6px;box-shadow:var(--shadow)}
  .article h1{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.025em;line-height:1.42;margin-bottom:14px}
  .article .abyline{display:flex;align-items:center;gap:8px 10px;color:var(--faint);font-size:13.5px;margin-bottom:22px;flex-wrap:wrap}
  .article .abyline .byline{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto;min-width:0}
  .article .abyline .who{color:var(--text);font-weight:700;white-space:nowrap}
  .article h4{font-size:12px;font-weight:900;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin:26px 0 8px}
  .article p{color:var(--text);font-size:15.5px;line-height:1.85;white-space:pre-wrap}
  .article .insight{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 26px;margin-top:6px}
  .article .insight>*:first-child{margin-top:0}
  .article .insight>*:last-child{margin-bottom:0}
  .article .insight p{color:var(--text);font-size:15px;line-height:1.8;margin:10px 0;white-space:normal}
  .article p.psum{white-space:normal}
  .article .insight a,.article p.psum a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
  .article .insight code{background:var(--bg-soft);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:.92em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  /* 소제목 3단계 — 크기·굵기·구분선으로 층위를 확실히 나눕니다
     마크다운 #/##/### 과 노션 제목1/2/3 이 같은 층위로 보이게 맞춰둔 규칙입니다 */
  .article .insight h1,.article .insight h2,.article .insight h3.ih1{font-size:19px;font-weight:900;color:var(--text);letter-spacing:-.02em;margin:28px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .article .insight h3,.article .insight h4.ih2{font-size:16.5px;font-weight:800;color:var(--text);letter-spacing:-.015em;margin:24px 0 8px}
  .article .insight h4,.article .insight h5,.article .insight h6,.article .insight h5.ih3{font-size:14.5px;font-weight:800;color:var(--muted);letter-spacing:-.01em;margin:18px 0 6px}
  .article .insight ul,.article .insight ol{margin:10px 0 10px 22px;color:var(--text)}
  .article .insight li{margin:5px 0;line-height:1.8;font-size:15px}
  .article .insight li::marker{color:var(--accent);font-weight:700}
  .article .insight blockquote{border-left:3px solid var(--border-strong);padding:2px 0 2px 14px;margin:12px 0;color:var(--muted)}
  .article .insight pre{background:var(--bg-soft);border:1px solid var(--border);padding:12px 14px;border-radius:2px;overflow-x:auto;font-size:13px;line-height:1.6;white-space:pre-wrap;margin:12px 0}
  .article .insight pre code{background:none;border:none;padding:0}
  .article .insight hr{border:none;border-top:1px solid var(--border);margin:18px 0}
  /* ---- 표 (노션 표 블록) ----
     리서치 리포트처럼 평면으로. 둥근 모서리·그림자·카드 효과를 쓰지 않고,
     바깥 테두리는 네 방향 모두 같은 중립색(#C9B9AA)입니다.
     가로 스크롤은 표를 감싼 .itbl-wrap 안에서만 일어납니다.
     (예전에는 표 자체에 display:block 이 걸려 있어 내용 폭만큼만 줄어들면서
      오른쪽에 빈 자리가 남았습니다) */
  .article .insight .itbl-wrap{overflow-x:auto;margin:18px 0;-webkit-overflow-scrolling:touch}
  .article .insight table{display:table;border-collapse:collapse;width:100%;margin:0;
    font-size:14.5px;line-height:1.65;background:#FFFDF8;
    border:1px solid #C9B9AA;border-radius:0;box-shadow:none;overflow:visible}
  /* 두 칸짜리 표만 38% : 62% 로 고정합니다.
     3~5칸 표(전체 18개 중 14개)는 내용에 맞춰 자동 배분되도록 그대로 둡니다. */
  .article .insight table:has(tr:first-child > :first-child:nth-last-child(2)){table-layout:fixed}
  .article .insight table tr:first-child > :first-child:nth-last-child(2){width:38%}
  .article .insight table th,
  .article .insight table td{border:1px solid #C9B9AA;padding:14px 18px;text-align:left;
    vertical-align:middle;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
  /* 헤더 */
  .article .insight table th{background:#D04A02;color:#FFF9F2;font-weight:800;padding-top:15px;padding-bottom:15px}
  .article .insight table th + th{border-left:1px solid rgba(255,249,242,.38)}
  /* 본문 — 헤더가 있는 표는 본문 첫 줄이 두 번째 tr 이라 짝수 줄이 밝은 색입니다 */
  .article .insight table td{color:#171410}
  .article .insight table tr:nth-child(even) td{background:#FFFDF8}
  .article .insight table tr:nth-child(odd) td{background:#F3E6D9}
  /* 헤더가 없는 표(1개)는 첫 줄부터 본문이므로 순서를 뒤집습니다 */
  .article .insight table:not(:has(th)) tr:nth-child(odd) td{background:#FFFDF8}
  .article .insight table:not(:has(th)) tr:nth-child(even) td{background:#F3E6D9}
  /* 좁은 화면에서는 글자가 눌리지 않게 최소 폭을 주고, 넘치면 표 안에서만 가로로 넘깁니다 */
  @media(max-width:640px){
    .article .insight table{min-width:420px}
    .article .insight table th,.article .insight table td{min-width:6.5em;padding:12px 14px}
  }
  /* 주제 배지는 카드 오른쪽 아래(작성자·날짜 줄 끝)에 붙습니다 */
  /* 주제 배지: 글자를 자르지 않고, 안 들어가면 줄바꿈해서 전부 보여줍니다 */
  .card .foot .ctopics,.feat-body .foot .ctopics{display:flex;align-items:center;flex-wrap:wrap;gap:5px;
    min-width:0;margin-left:auto;padding-left:6px;justify-content:flex-end;flex:0 1 auto}
  .card .foot .ctopics .tag,.feat-body .foot .ctopics .tag{font-size:10.5px;padding:2px 8px;white-space:nowrap;flex:0 0 auto}
  .article h1.ptitle{margin-top:12px}
  .src{display:inline-flex;align-items:center;gap:7px;margin-top:26px;padding:11px 17px;border:1px solid var(--border-strong);border-radius:2px;font-size:14px;font-weight:700;color:var(--muted);transition:.15s}
  .src:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

  footer{border-top:1px solid var(--border);margin-top:64px;padding:32px 0;color:var(--faint);font-size:13px;text-align:center;font-weight:600}
  /* 제호는 홈에만 나오므로, 다른 화면에서 돌아갈 길을 푸터에 둡니다 */
  .ft-nav{display:flex;gap:var(--s5);flex-wrap:wrap;justify-content:center;margin-bottom:var(--s3)}
  .ft-nav a{font-size:13px;font-weight:700;color:var(--muted);transition:color .15s}
  .ft-nav a:hover,.ft-nav a.active{color:var(--accent)}
  .empty{color:var(--faint);padding:40px 0;text-align:center;font-size:14px}
  .loading{padding:80px 0;text-align:center;color:var(--muted)}
  .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .banner{background:var(--amber-soft);border:1px solid rgba(209,129,15,.3);color:var(--amber);font-size:13px;font-weight:600;padding:11px 16px;border-radius:2px;margin-top:18px}

  /* ---------- 상세 페이지 2/3 + 1/3 레이아웃 ---------- */
  /* 헤더(Yerim Bae)와 좌우 폭을 정확히 맞춤 — 별도 확장 없음 */
  #app.wide{max-width:var(--maxw)}
  .post-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}
  .post-main{min-width:0}
  /* 본문은 박스 없이 배경 위에 그대로 (참고: 뉴닉 스타일) */
  .post-layout .article{margin-top:0;padding:4px 2px 0;background:none;border:none;box-shadow:none}
  .post-layout .article .abyline{padding-bottom:20px;margin-bottom:6px;border-bottom:1px solid var(--border)}
  .post-layout .article .insight{background:none;border:none;padding:0;margin-top:2px}
  .post-layout .article .insight pre,.post-layout .article .insight table{background:var(--bg-soft)}
  /* "요약" · "인사이트" 섹션 제목만 키움 (본문 글자 크기는 그대로) */
  .post-layout .article > h4{font-size:16px;letter-spacing:.02em;margin:30px 0 10px}

  /* 기사 상단 대표 이미지 (제목 박스 위) — 2:1 프레임 */
  .pcover{position:relative;display:block;width:100%;aspect-ratio:2/1;overflow:hidden;border-radius:var(--radius);
          border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow)}
  .pcwrap{margin:0 0 16px}
  /* 이미지 출처 (노션 캡션) */
  .pccap{margin-top:8px;padding:0 2px;font-size:13px;font-weight:600;line-height:1.6;color:var(--faint);text-align:right}
  .pccap a{color:var(--muted);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
  .pcover img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
  /* 카드 썸네일 — 16:9 프레임 */
  .card .thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:2px;
               background:var(--card);border:1px solid var(--border);margin-bottom:12px}
  .card .thumb img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
  .card:hover .thumb img{transform:scale(1.04)}

  /* 프레임보다 세로로 긴 이미지(로고·인포그래픽 등)는 자르지 않고 전부 보여주고,
     남는 좌우 여백은 같은 이미지를 흐리게 깔아 자연스럽게 채웁니다 */
  .pcover.fit img,.thumb.fit img,.feat-cover.fit img,
  .lcover.fit img,.acover.fit img,.rcover.fit img{object-fit:contain}
  .pcover.fit img,.feat-cover.fit img,.lcover.fit img{padding:16px}
  .acover.fit img,.rcover.fit img{padding:12px}
  .lead:hover .lcover.fit img{transform:none}
  .thumb.fit img{padding:10px}
  .card:hover .thumb.fit img{transform:none}
  .feat-main:hover .feat-cover.fit img{transform:none}
  .pcover.fit::before,.thumb.fit::before,.feat-cover.fit::before,
  .lcover.fit::before,.acover.fit::before,.rcover.fit::before{content:"";position:absolute;inset:0;z-index:0;
    background-image:var(--bgimg);background-size:cover;background-position:center;
    filter:blur(30px) saturate(1.1);transform:scale(1.25)}
  .pcover.fit::after,.thumb.fit::after,.feat-cover.fit::after,
  .lcover.fit::after,.acover.fit::after,.rcover.fit::after{content:"";position:absolute;inset:0;z-index:0;background:rgba(255,255,255,.30)}
  /* 본문 안 이미지 (두 번째 이후) */
  .article .insight figure.ifig{margin:16px 0}
  .article .insight figure.ifig img{width:100%;max-height:420px;object-fit:contain;display:block;
                                    border:1px solid var(--border);border-radius:2px;background:var(--bg-soft)}
  /* 본문 안 이미지 출처도 상단 배너와 동일한 모양 (오른쪽 아래, 작은 회색 글씨) */
  .article .insight figure.ifig figcaption{margin-top:8px;padding:0 2px;font-size:13px;font-weight:600;
                                           color:var(--faint);text-align:right;line-height:1.6}
  .article .insight figure.ifig figcaption a{color:var(--muted);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
  /* 노션 본문에 올린 자료(HTML·PDF 등) — 페이지 안에 끼워 넣지 않고 새 창으로 엽니다.
     좁은 틀에 가두면 자료 자체의 디자인이 눌리기 때문입니다. */
  .article .insight a.ifile{display:grid;grid-template-columns:minmax(0,1fr) auto;
    align-items:baseline;gap:8px 18px;margin:20px 0;padding:17px 20px;
    border:1px solid var(--border-strong);background:var(--bg-soft);
    transition:border-color .15s,background-color .15s}
  .article .insight a.ifile:hover{border-color:var(--text);background:var(--card)}
  .article .insight a.ifile .if-k{grid-column:1/-1;font-size:10.5px;font-weight:800;
    letter-spacing:.12em;line-height:1.5;text-transform:uppercase;color:var(--accent)}
  .article .insight a.ifile .if-t{font-family:var(--serif);font-size:16px;font-weight:700;
    letter-spacing:-.025em;line-height:1.5;color:var(--text);word-break:keep-all;overflow-wrap:anywhere}
  .article .insight a.ifile .if-go{font-size:12px;font-weight:700;color:var(--faint);
    white-space:nowrap;transition:color .15s}
  .article .insight a.ifile:hover .if-go{color:var(--accent)}
  @media(max-width:560px){
    .article .insight a.ifile{grid-template-columns:minmax(0,1fr)}
    .article .insight a.ifile .if-go{margin-top:2px}
  }
  /* 링크 북마크·첨부 파일 */
  .article .insight a.ibookmark{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    margin:14px 0;padding:13px 16px;border:1px solid var(--border);border-radius:2px;
    background:var(--bg-soft);transition:border-color .15s,background .15s}
  .article .insight a.ibookmark:hover{border-color:var(--text);background:var(--card)}
  .article .insight a.ibookmark .ibk-t{flex:1 1 auto;min-width:0;font-size:14px;font-weight:700;
    line-height:1.6;color:var(--text);word-break:break-all}
  .article .insight a.ibookmark .ibk-h{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .post-layout .article h1{font-size:28px;line-height:1.38;margin-bottom:16px}
  .post-side{position:sticky;top:72px;display:grid;grid-template-rows:1fr 1fr;gap:16px;min-width:0}
  .spanel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 16px 14px;box-shadow:var(--shadow);
          display:flex;flex-direction:column;min-height:0}
  .spanel .sh{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .spanel .sh h3{font-size:12.5px;font-weight:900;color:var(--accent);letter-spacing:.05em;text-transform:uppercase}
  .spanel .sh h3{font-size:12px;letter-spacing:.04em}
  .spanel .sh span{font-size:11px;color:var(--faint);font-weight:600;margin-left:auto;white-space:nowrap;
                   overflow:hidden;text-overflow:ellipsis;max-width:44%}
  .spanel .slist{display:flex;flex-direction:column;gap:4px}
  .scard{display:block;padding:8px 9px;border-radius:2px;cursor:pointer;transition:.15s;border:1px solid transparent;min-width:0}
  .scard:hover{background:var(--bg-soft);border-color:var(--border)}
  .scard.cur{background:var(--accent-soft);border-color:rgba(216,102,47,.22)}
  .scard .st{font-size:13.5px;font-weight:700;line-height:1.45;letter-spacing:-.015em;color:var(--text);
             display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .scard:hover .st{color:var(--accent)}
  .scard .sm{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11.5px;color:var(--faint);font-weight:600;min-width:0}
  .scard .sm .who{color:var(--muted)}
  .scard .sm .tag{font-size:10px;padding:1px 7px;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spanel .sempty{color:var(--faint);font-size:12.5px;padding:14px 4px;text-align:center;line-height:1.6}
  .spanel .smore{margin-top:auto;padding-top:10px;font-size:12px;font-weight:800;color:var(--accent)}
  .spanel .smore:hover{text-decoration:underline}
  @media(max-width:1000px){
    #app.wide{max-width:var(--maxw)}
    .post-layout{grid-template-columns:1fr}
    .post-side{position:static;grid-template-rows:auto auto;margin-top:8px}
  }

  /* =========================================================================
     홈 1면 — 신문 조판
     ── 그리드 기준 ────────────────────────────────────────────────────────
       · 지면 폭 1120px, 좌우 안여백 20px → 글상자 1080px
       · 3단 비율 .92 : 2 : 1.06 (기존 비율 유지)
       · 모든 단은 좌우 --gut(20px) 안여백을 똑같이 갖습니다.
         단 묶음을 바깥으로 -20px 밀어, 첫 단 왼쪽선과 끝 단 오른쪽선이
         제호·본문과 같은 기준선에 놓입니다.
       · 3단은 그리드가 같은 높이로 늘려 주고, 아래 4단은 subgrid 로 줄을 맞춥니다.
         높이를 억지로 고정하지 않고 그리드만으로 수평 기준선을 맞춥니다.
     ── 선 기준 ────────────────────────────────────────────────────────────
       --rule-page   3px  제호 아래 (지면 최상단)
       --rule-strong 1px  강조 구획의 위·아래
       --rule-col    1px  칼럼 세로 구분선
       --rule-item   1px  기사와 기사 사이 (가장 옅음)
       점선은 쓰지 않습니다. 굵기는 모두 1px, 명도만 다릅니다.
     ========================================================================= */
  .front{--cols:minmax(0,.92fr) minmax(0,2fr) minmax(0,1.06fr)}

  /* 포트폴리오로 돌아가는 링크. 지면 왼쪽 끝(24px)에 두되 제호 그리드는 건드리지
     않도록 따로 띄웁니다. calc(24px - 50vw + 50%) 는 가운데 정렬된 제호를 기준으로
     화면 왼쪽 24px 지점입니다. 제호 가운데에 이미 이름이 있어 여기서는 뺐습니다. */
  .masthead .mh-brand{position:absolute;left:calc(24px - 50vw + 50%);top:var(--s4);
    display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
    font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);
    transition:gap .18s cubic-bezier(.22,.7,.3,1),color .18s ease}
  .masthead .mh-brand:hover{gap:14px;color:var(--accent-deep)}
  .masthead .mh-brand .ar{font-size:1.1em;line-height:1;letter-spacing:0}
  .masthead{position:relative;margin-top:var(--s3);padding:var(--s4) 0 var(--s3);
    border-bottom:var(--rule-page);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:var(--s5)}
  /* 날짜·분량은 제호 첫 줄(부제)과 같은 높이에 놓습니다 */
  .masthead .mh-l,.masthead .mh-count{font-size:11px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .masthead .mh-l{align-self:start}
  /* 오른쪽 칸: 위에 분량, 아래에 구역 링크 */
  .masthead .mh-r{display:flex;flex-direction:column;justify-content:space-between;
    align-items:flex-end;text-align:right;gap:var(--s3)}
  .masthead .mh-nav{display:flex;gap:var(--s4);flex-wrap:wrap;justify-content:flex-end}
  .masthead .mh-nav a{font-size:13px;font-weight:700;letter-spacing:-.01em;color:var(--muted);transition:color .15s}
  .masthead .mh-nav a:hover,.masthead .mh-nav a.active{color:var(--accent)}
  .masthead .mh-c{text-align:center;min-width:0}
  .masthead .mh-tag{font-family:var(--serif);font-size:12px;font-style:italic;color:var(--muted);margin-bottom:var(--s2)}
  .masthead h1{font-family:var(--serif);font-size:clamp(30px,5.6vw,54px);font-weight:700;
    letter-spacing:.03em;line-height:1;text-transform:uppercase}
  .masthead .mh-sub{margin-top:var(--s2);font-size:12.5px;color:var(--muted)}
  @media(max-width:700px){
    .masthead{grid-template-columns:minmax(0,1fr);gap:var(--s2);text-align:center}
    /* 좁은 화면에서는 돌아가기 링크도 흐름 안으로 들어와 가운데 정렬 */
    .masthead .mh-brand{position:static;display:flex;justify-content:center;margin-bottom:var(--s2)}
    .masthead .mh-l,.masthead .mh-r{text-align:center;align-items:center}
    .masthead .mh-nav{justify-content:center}
  }

  /* ---- 1면 3단 ---- */
  .front{display:grid;grid-template-columns:var(--cols);margin:0 calc(-1 * var(--gut));
    border-bottom:var(--rule-strong)}
  .front > *{padding:var(--s6) var(--gut) var(--s7);min-width:0;display:flex;flex-direction:column;position:relative}
  /* 칼럼 세로선은 테두리가 아니라 가는 막대로 그립니다.
     위아래를 --rule-inset(0.7cm) 만큼 띄워 지면 위·아래 가로선에 닿지 않게 합니다. */
  .front > * + *::before{content:"";position:absolute;left:0;top:var(--rule-inset);bottom:var(--rule-inset);
    width:1px;background:var(--rule-col-c)}

  @media(max-width:980px){
    .front{grid-template-columns:minmax(0,1fr);margin:0}
    .front > *{padding-left:0;padding-right:0}
    .front > * + *::before{left:0;right:0;top:0;bottom:auto;width:auto;height:1px}
  }

  /* ---- 왼쪽: 한눈에 보기 ---- */
  .glance h2{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:-.035em;line-height:1.3}
  .glance .upd{display:flex;align-items:center;gap:var(--s1);margin:var(--s2) 0 var(--s4);
    font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--faint)}
  .glance .upd i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 2s infinite}
  /* 목록이 칼럼 높이를 채우도록 늘어납니다. 각 항목이 균등하게 넓어져
     오른쪽 칼럼(PICK)의 아래 기준선과 자연스럽게 맞습니다. */
  .glance ol{list-style:none;counter-reset:g;border-top:var(--rule-item);
    flex:1 1 auto;display:flex;flex-direction:column}
  /* 모든 항목의 위아래 여백과 번호·제목 간격을 같은 값으로 둡니다 */
  .glance li{counter-increment:g;display:grid;grid-template-columns:16px minmax(0,1fr);gap:var(--s3);
    align-content:center;flex:1 1 0;min-height:0;
    padding:var(--s3) 0;border-bottom:var(--rule-item)}
  /* 마지막 항목도 위아래 여백을 똑같이 두고 선만 뺍니다 (목록의 리듬 유지) */
  .glance li:last-child{border-bottom:none}
  .glance li::before{content:counter(g);font-family:var(--serif);font-size:13px;font-weight:700;
    color:var(--accent);line-height:1.7;text-align:right}
  /* 제목과 주제를 한 덩어리로 묶습니다.
     묶지 않으면 주제가 번호 칸(16px)으로 밀려 한 글자씩 세로로 쪼개집니다. */
  .glance .gtext{min-width:0}
  .glance a{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    font-size:13.5px;line-height:1.7;font-weight:700;color:var(--text);
    text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;text-decoration-color:rgba(28,26,25,.25)}
  .glance a:hover{color:var(--accent);text-decoration-color:var(--accent)}
  .glance .gmeta{display:block;margin-top:var(--s1);font-size:11px;font-weight:700;letter-spacing:.05em;
    line-height:1.5;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- 가운데: 머리기사 ---- */
  .lead{cursor:pointer}
  .lead h2{font-family:var(--serif);font-size:clamp(25px,3.4vw,38px);font-weight:700;
    letter-spacing:-.038em;line-height:1.26;text-align:center;transition:color .15s}
  .lead:hover h2{color:var(--accent)}
  /* 부제도 제목·이미지와 같은 좌우 기준선을 씁니다 (max-width 로 좁히지 않음) */
  .lead .deck{margin-top:var(--s3);text-align:center;font-size:15px;line-height:1.72;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .lead figure{margin-top:var(--s4)}
  .lead .lcover{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:var(--bg-soft)}
  .lead .lcover img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
  .lead:hover .lcover img{transform:scale(1.02)}
  /* 출처는 이미지의 오른쪽 끝선에 맞춥니다 */
  .lead figcaption{margin-top:var(--s2);font-size:11px;font-weight:600;line-height:1.5;color:var(--faint);text-align:right}
  /* 작성자 정보는 제목·부제와 같은 중심축에 맞춥니다 */
  .lead .lfoot{margin-top:var(--s4);display:flex;justify-content:center;align-items:center;gap:var(--s2);flex-wrap:wrap;
    font-size:12.5px;line-height:1.5;color:var(--faint)}


  /* ---- 오른쪽: 보조기사 ---- */

            mask-image:linear-gradient(180deg,#000 calc(100% - 20px),transparent)}
  /* 좁은 화면에서는 칸이 세로로 쌓여 남는 높이가 없으므로 줄 수로만 제한합니다 */

  .viewbox{display:grid;grid-template-columns:1fr 1fr;margin:var(--s5) calc(-1 * var(--s3)) 0;
    border-top:var(--rule-strong)}
  .viewbox .vcell{position:relative;display:flex;flex-direction:column;padding:var(--s4) var(--s3);min-width:0;cursor:pointer}

  .viewbox .vcell + .vcell::before{content:"";position:absolute;left:0;top:var(--rule-inset-sm);bottom:var(--rule-inset-sm);
    width:1px;background:var(--rule-col-c)}
  .viewbox .vk{font-size:10.5px;font-weight:800;letter-spacing:.08em;line-height:1.5;text-transform:uppercase;color:var(--accent)}
  .viewbox .vt{font-family:var(--serif);font-size:14.5px;font-weight:700;letter-spacing:-.025em;line-height:1.45;
    margin-top:var(--s2);transition:color .15s;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .viewbox .vcell:hover .vt{color:var(--accent)}


  /* ---- 1면 아래 4단 ----

     같은 줄끼리 같은 높이에 놓입니다. 높이를 강제로 고정하지 않습니다. */
  .frontrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    grid-template-rows:auto auto 1fr auto;
    margin:0 calc(-1 * var(--gut));border-bottom:var(--rule-strong)}
  .frontrow > *{grid-row:span 4;display:grid;grid-template-rows:subgrid;
    padding:var(--s6) var(--gut);min-width:0;cursor:pointer;position:relative}

    width:1px;background:var(--rule-col-c)}
  .frontrow h3{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:-.033em;line-height:1.36;transition:color .15s;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  .frontrow .rdesc{margin-top:var(--s3);font-size:13.5px;line-height:1.68;color:var(--muted);

  .frontrow .rcover{position:relative;align-self:start;margin-top:var(--s4);width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--bg-soft)}

  @supports not (grid-template-rows:subgrid){
    .frontrow{grid-template-rows:none}
    .frontrow > *{grid-row:auto;display:block}

  @media (hover:hover) and (pointer:fine){

// 로컬 미리보기(샘플)에서만 쓰는 예시 한줄소개
const SAMPLE_AUTHORS = {

/* ---- 유틸 ---- */
const $app = document.getElementById("app");
const initial = (name) => (name||"").slice(-2);
// 요약 줄별 앞 공백 제거 -> 글머리 기호가 계단식으로 밀리지 않고 왼쪽 정렬
const fmtSummary = (s) => (s||"").split("\n").map(l=>l.replace(/^[\s 　]+/,"")).join("<br>");
// 작성자 아바타: authors/ 또는 assets/authors/ 폴더의 <이름>.png/.jpg를 순서대로 시도, 없으면 이니셜로 폴백
function avatarHtml(name, style){
  const n = encodeURIComponent(name||"");
  const list = ["authors/"+n+".png","authors/"+n+".jpg","assets/authors/"+n+".png","assets/authors/"+n+".jpg"];
  const st = style ? ` style="${style}"` : "";
  return `<span class="avatar"${st}><img src="${list[0]}" alt="" loading="lazy" data-i="0" data-list="${list.join("|")}" onerror="var l=this.dataset.list.split('|'),i=+this.dataset.i+1;if(i&lt;l.length){this.dataset.i=i;this.src=l[i];}else{this.style.display='none';}">${initial(name)}</span>`;
}
/* 주제(Topic) 이름 → 배지 색. 노션 Topic 열에 값을 추가하면 여기에도 한 줄 넣어주세요(없으면 기본 파랑) */
const TOPIC_TONE = {
  "DeFi":"tp-orange","시장":"tp-blue","투자":"tp-orange","규제/법안":"tp-gray","기술":"tp-yellow",
  "예측시장":"tp-gray","기관":"tp-pink","기타":"tp-purple","스테이블코인":"tp-red","보안":"tp-green","RWA":"tp-brown"
};
const tagClass = (t) => TOPIC_TONE[t] || (t.includes("규제") ? "g" : (["프로젝트","DeFi","L2","프로젝트분석"].includes(t) ? "a" : ""));
const fmtDate = (d) => { if(!d||d.indexOf("-")<0) return d||""; const [,m,day]=d.split("-"); return `${m}.${day}`; };
// 발행일(YYYY-MM-DD)로 그 주(일~토) 범위를 계산 -> {label:"2026.04.05~04.11", start:"2026-04-05"}
function deriveWeek(dateStr){
  if(!dateStr||dateStr.indexOf("-")<0) return {label:"미분류", start:"0000-00-00"};
  const d=new Date(dateStr+"T00:00:00"); if(isNaN(d)) return {label:"미분류", start:"0000-00-00"};
  const s=new Date(d); s.setDate(d.getDate()-d.getDay());
  const e=new Date(s); e.setDate(s.getDate()+6);
  const p2=n=>String(n).padStart(2,"0");
  const f=x=>`${x.getFullYear()}.${p2(x.getMonth()+1)}.${p2(x.getDate())}`;
  const fe=x=>`${p2(x.getMonth()+1)}.${p2(x.getDate())}`;
  return {label:`${f(s)}~${fe(e)}`, start:`${s.getFullYear()}-${p2(s.getMonth()+1)}-${p2(s.getDate())}`};
}
const tagsHtml = (tags)=>`<div class="tags">${tags.map(t=>`<span class="tag ${tagClass(t)}">${t}</span>`).join("")}</div>`;

/* 카드 하단에 붙는 주제 배지 — 최대 3개.
   공간이 모자라면 뒤쪽 배지부터 자동으로 숨겨져(CSS) 잘린 글자가 생기지 않습니다.
   배지를 누르면 그 주제 목록으로 이동합니다(카드 클릭과 겹치지 않도록 전파를 막습니다) */
function cardTopicsHtml(p){
  const ts=(p.topics||[]).filter(Boolean).slice(0,3);

  return `<span class="ctopics">${ts.map(t=>
    `<a class="tag ${tagClass(t)} tlink" href="#/topic/${encodeURIComponent(t)}" onclick="event.stopPropagation()">${t}</a>`

}
/* 이미지 비율을 보고 채우기 방식을 자동으로 정합니다.
   프레임보다 충분히 가로로 긴 사진 → 꽉 채워 크롭(cover)
   정사각형·세로 이미지(로고 등) → 자르지 않고 전부 표시 + 흐린 배경으로 여백 채움 */
function fitCover(img){
  const box = img.parentElement;
  if(!box) return;
  const fr = Number(box.dataset.fr) || 2;                 // 프레임 가로/세로 비율
  const ir = img.naturalWidth / img.naturalHeight;        // 이미지 가로/세로 비율
  if(!ir || !isFinite(ir)) return;
  // 잘림을 어디까지 참을지. 기본 .62 는 기존 화면 그대로 두고,
  // 1면처럼 틀이 얕은 곳은 data-fit-at 으로 더 일찍(=덜 잘리게) 넘깁니다.
  const at = Number(box.dataset.fitAt) || 0.62;
  if(ir < fr*at){                                         // 너무 많이 잘려나갈 이미지
    box.classList.add("fit");
    box.style.setProperty("--bgimg", `url("${img.currentSrc||img.src}")`);
  }
}
window.fitCover = fitCover;

/* 대표 이미지 — 카드 썸네일 / 기사 상단 배너. 이미지가 없거나 깨지면 자동으로 사라집니다 */
function thumbHtml(p){
  if(!p.cover) return "";
  return `<div class="thumb" data-fr="1.778"><img src="${p.cover}" alt="" loading="lazy"
    onload="fitCover(this)" onerror="this.closest('.thumb').remove()"></div>`;
}
function coverHtml(p){
  if(!p.cover) return "";
  // 이미지 출처 = 노션에서 그 이미지 밑에 적어둔 캡션 (없으면 표시 안 함)
  const cap = (p.coverCaption||"").trim();
  return `<figure class="pcwrap">
    <div class="pcover" data-fr="2"><img src="${p.cover}" alt="${(p.title||"").replace(/"/g,"&quot;")}"
      onload="fitCover(this)" onerror="this.closest('.pcwrap').remove()"></div>
    ${cap?`<figcaption class="pccap">${cap}</figcaption>`:""}
  </figure>`;
}
function cardHtml(p, i){
  const delay = Math.min((i||0)*60, 480);
  return `<article class="card" style="animation-delay:${delay}ms" onclick="location.hash='#/post/${p.id}'">
    ${thumbHtml(p)}
${tagsHtml(p.tags)}
    <h3>${p.title}</h3>
    <div class="foot"><span class="byline">${avatarHtml(p.author)}<span class="who">${p.author}</span> · <span>${fmtDate(p.date)}</span></span>${cardTopicsHtml(p)}</div>

}

const GLANCE_N = 5;   // 왼쪽 "한눈에 보기" 줄 수
const ROW_N    = 4;   // 1면 아래 가로줄 기사 수

// 왼쪽 단 — 번호가 붙은 한 줄 목록
function glanceHtml(items, updated){

// 가운데 단 — 머리기사
function leadHtml(p){

/* 오른쪽 보조기사에 실을 글.
   요약이 짧으면(48자짜리도 있습니다) 칼럼 아래가 비어 보이므로
   본문 앞부분을 이어 붙여 채웁니다. 넘치는 만큼은 CSS 가 잘라냅니다. */
function asideLead(p){
  const sum = String(p.summary || "").replace(/\s+/g, " ").trim();
  if(sum.length >= 200) return sum;
  const body = String(p.insight || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  if(!body) return sum;
  return sum ? sum + " — " + body : body;
}
// 오른쪽 단 — 보조기사 바로 아래에 직접 고른 글 2칸
function asideHtml(second, picks){
  const s = second ? `<a class="astory" href="#/post/${second.id}">
      <h3>${second.title}</h3>
      ${(()=>{const t=asideLead(second);return t?`<p class="adesc">${t}</p>`:"";})()}
      ${second.cover?`<div class="acover" data-fr="1.333" data-fit-at="0.8"><img src="${second.cover}" alt="" loading="lazy" onload="fitCover(this)" onerror="this.closest('.acover').remove()"></div>`:""}
    </a>` : `<p class="empty" style="padding:0">아직 다른 글이 없습니다.</p>`;
  const box = picks.length ? `<div class="viewbox">${picks.map(p=>
      `<div class="vcell" onclick="location.hash='#/post/${p.id}'">
        <div class="vk">Pick</div>
        <div class="vt">${p.title}</div>
      </div>`).join("")}</div>` : "";
  return `<div class="aside">${s}${box}</div>`;
}

      ${p.cover?`<div class="rcover" data-fr="1.333" data-fit-at="0.8"><img src="${p.cover}" alt="" loading="lazy" onload="fitCover(this)" onerror="this.closest('.rcover').remove()"></div>`:""}
      <div class="rmeta">${p.author||""} · ${fmtDate(p.date)}</div>

function viewDash(){
  if(!POSTS.length) return `${mastheadHtml()}<p class="empty">아직 글이 없습니다.</p>`;
  const sorted=[...POSTS].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  /* 자리마다 글을 하나씩 배정합니다. 한 번 쓴 글은 used 에 넣어
     다음 자리에서 제외하므로, 같은 글이 두 군데 나오지 않습니다.
     순서: 머리기사 -> 직접 고른 글 -> 보조기사 -> 한눈에보기 -> 가운데 아래 -> 오른쪽 아래 -> 가로줄 */
  const used=new Set();
  const take=(n,filter)=>{
    const out=[];
    for(const p of sorted){
      if(out.length>=n) break;
      if(used.has(String(p.id))) continue;
      if(filter && !filter(p)) continue;
      used.add(String(p.id)); out.push(p);
    }
    return out;
  };
  // 머리기사 = 이미지가 있는 가장 최근 글(없으면 그냥 최신 글)
  const lead=take(1,p=>p.cover)[0] || take(1)[0];
  // 직접 고른 글 — 노션 Pick 체크박스. 머리기사로 이미 쓴 글은 빠집니다
  const picks=take(2,p=>p.pick);
  // 오른쪽 보조기사 = 남은 글 중 이미지가 있는 첫 글
  const second=take(1,p=>p.cover)[0] || take(1)[0] || null;
  /* 1면 아래 가로줄 — 사진이 실리는 자리라 표지가 있는 글을 먼저 채웁니다.
     한눈에보기는 제목만 쓰므로 표지 없는 글로 채워도 됩니다. */
  const row=take(ROW_N,p=>p.cover);
  if(row.length<ROW_N) row.push(...take(ROW_N-row.length));
  // 왼쪽 한눈에보기
  const glance=take(GLANCE_N);

  // 주제 탭 — 미분류 제외, 글 많은 순
  const map=topicMap();
  const tnames=Object.keys(map).filter(n=>n!==NO_TOPIC)
    .sort((a,b)=>map[b].length-map[a].length || a.localeCompare(b,"ko"));
  const first=tnames[0]||"";
  const firstItems=first?map[first].slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,DASH_TOPIC_N):[];

  return `${mastheadHtml()}
  <div class="front">
    ${glanceHtml(glance, sorted[0] && sorted[0].date)}
    <div class="leadcol">${leadHtml(lead)}</div>
    ${asideHtml(second, picks)}
  </div>
  ${frontRowHtml(row)}

  <div class="sec-head"><h2>주제별</h2><span>관심 주제로 모아보기</span></div>
  ${tnames.length?`<div class="ttabs">${tnames.map(n=>
      `<button type="button" class="ttab${n===first?" on":""}" data-topic="${n.replace(/"/g,"&quot;")}"
        onclick="dashTopic(this.dataset.topic)">${n}<span class="tn">${map[n].length}</span></button>`).join("")}
    <a class="ttab" id="dashTopicMore" href="#/topic/${encodeURIComponent(first)}" style="margin-left:auto;background:none">더보기 →</a></div>
  <div class="grid" id="dashTopicGrid">${firstItems.map((p,i)=>cardHtml(p,i)).join("")}</div>`
  :`<div class="banner">노션 DB에 <b>Topic</b> 열을 만들고 글마다 주제를 골라주시면 여기에 주제별로 나뉘어 표시됩니다.</div>`}`;
}
function viewWeeks(){
  const starts=[...new Set(POSTS.map(p=>deriveWeek(p.date).start))].sort((a,b)=>b.localeCompare(a));
  return `<div class="sec-head" style="margin-top:34px"><h2>주차별 기록</h2><span>주 단위(일~토)로 모아보기</span></div>
  ${starts.map(st=>{const items=POSTS.filter(p=>deriveWeek(p.date).start===st).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const label=items.length?deriveWeek(items[0].date).label:st;
    return `<div class="week-block"><span class="week-tag">${label} · ${items.length}건</span><div class="grid">${items.map((p,i)=>cardHtml(p,i)).join("")}</div></div>`;}).join("")}`;
}
/* ---- 주제별 ----
   노션 Topic 열을 읽습니다. 선택/다중선택/텍스트 어느 타입이든 동작하고,
   아직 분류 안 한 글은 "미분류"로 모아 맨 뒤에 둡니다. */
const NO_TOPIC="미분류";
function topicsOf(p){
  const t=(p.topics||[]).filter(Boolean);
  return t.length?t:[NO_TOPIC];
}
function topicMap(){
  const map={};
  POSTS.forEach(p=>topicsOf(p).forEach(t=>{(map[t]=map[t]||[]).push(p);}));
  return map;
}
/* 주제 이름 정렬 — 건수 많은 순 → 같으면 가나다순, 미분류는 주제가 아니므로 맨 뒤 */
function topicNamesSorted(map){
  return Object.keys(map).sort((a,b)=>{
    if(a===NO_TOPIC) return 1; if(b===NO_TOPIC) return -1;
    return map[b].length-map[a].length || a.localeCompare(b,"ko");
  });
}
/* 주제별 화면 — 홈의 "주제별" 섹션과 같은 모양(탭 + 카드 그리드)입니다.
   다른 점은 고른 주제의 글을 3개가 아니라 전부 보여준다는 것.
   탭을 누르면 주소(#/topic/주제)가 바뀌므로 뒤로가기·링크 공유도 됩니다. */
function viewTopicPage(sel){
  const map=topicMap();
  const names=topicNamesSorted(map);
  if(!names.length) return `<div class="sec-head" style="margin-top:34px"><h2>주제별</h2></div><p class="empty">아직 글이 없습니다.</p>`;
  const only=names.length===1&&names[0]===NO_TOPIC;
  const cur=(sel&&map[sel])?sel:names[0];      // 주제를 안 골랐으면 첫 번째 주제
  const items=map[cur].slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return `<div class="sec-head" style="margin-top:34px"><h2>주제별</h2><span>관심 주제로 모아보기</span></div>
  ${only?`<div class="banner">노션 DB에 <b>Topic</b> 열을 만들고 글마다 주제를 골라주시면 여기에 나뉘어 표시됩니다.</div>`:""}
  <div class="ttabs">${names.map(n=>
    `<a class="ttab${n===cur?" on":""}" href="#/topic/${encodeURIComponent(n)}">${n}<span class="tn">${map[n].length}</span></a>`
  ).join("")}</div>
  <div class="grid">${items.length?items.map((p,i)=>cardHtml(p,i)).join(""):'<p class="empty">이 주제의 글이 아직 없습니다.</p>'}</div>`;
}
function viewTopics(){ return viewTopicPage(""); }
function viewTopic(name){ return viewTopicPage(name); }
function viewAuthors(){
  const map={};POSTS.forEach(p=>{(map[p.author]=map[p.author]||[]).push(p);});
  const names=Object.keys(map).sort((a,b)=>map[b].length-map[a].length);
  return `<div class="sec-head" style="margin-top:34px"><h2>작성자</h2><span>작성자별 아카이빙</span></div>
  <div class="authors">${names.map(n=>{const bio=(AUTHORS_META[n]&&AUTHORS_META[n].bio)||"";
    return `<div class="author-card" onclick="location.hash='#/author/${encodeURIComponent(n)}'">
    ${avatarHtml(n)}<div class="nm">${n}</div><div class="ct">기록 ${map[n].length}건</div>${bio?`<div class="abio">${bio}</div>`:""}</div>`;}).join("")}</div>`;
}
function viewAuthor(name){
  const items=POSTS.filter(p=>p.author===name).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return `<div class="back" onclick="location.hash='#/authors'">← 작성자 목록</div>
  <section class="hero" style="padding:14px 0 6px"><div class="hcopy"><h1 style="display:flex;align-items:center;gap:14px;font-size:28px">${avatarHtml(name,'width:46px;height:46px;font-size:18px')}<span style="display:inline-flex;align-items:center;gap:8px">${name}<span class="a-count">· ${items.length}건</span></span></h1>
  ${(AUTHORS_META[name]&&AUTHORS_META[name].bio)?`<p class="abio-lg">${AUTHORS_META[name].bio}</p>`:""}
  ${(AUTHORS_META[name]&&AUTHORS_META[name].about)?`<p class="about-lg">${AUTHORS_META[name].about}</p>`:""}</div></section>
  <div class="grid" style="margin-top:16px">${items.length?items.map((p,i)=>cardHtml(p,i)).join(""):'<p class="empty">아직 작성한 글이 없습니다.</p>'}</div>`;
}
/* ---- 인사이트 렌더링 ----
   1) insightMd(노션 Insight 속성에 쓴 마크다운 원문)를 마크다운으로 해석해 위에
   2) insight(노션 페이지 본문 블록을 서버에서 HTML로 만든 것)를 이어서 아래에
   둘 다 있으면 둘 다 보여줍니다 — 속성에 한 줄만 적고 본문에 정리한 글도 안 잘리게. */
function looksLikeMd(s){
  return /^\s{0,3}#{1,6}\s|\n\s{0,3}#{1,6}\s|\*\*[^*\n]+\*\*|^\s*[-*+]\s+|\n\s*[-*+]\s+|^\s*\d+\.\s|\n\s*\d+\.\s|\[[^\]\n]+\]\([^)\s]+\)|^\s*>\s|\n\s*\|.*\|/.test(s);
}
function mdToHtml(src){
  const s=String(src||"");
  if(!s.trim()) return "";
  if(window.marked&&marked.parse){
    // 링크는 새 탭에서 열리도록
    return marked.parse(s,{breaks:true,gfm:true})
      .replace(/<a href="(https?:[^"]+)"/g,'<a href="$1" target="_blank" rel="noopener"');
  }
  // marked를 못 불러왔을 때를 대비한 최소 폴백 (제목·굵게·링크·문단만)
  const esc=x=>x.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  return esc(s).split(/\n{2,}/).map(blk=>{
    const h=blk.match(/^(#{1,6})\s+(.*)$/);
    let t=blk.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
             .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    if(h) return `<h${h[1].length}>${t.replace(/^#{1,6}\s+/,"")}</h${h[1].length}>`;
    return `<p>${t.replace(/\n/g,"<br>")}</p>`;
  }).join("");
}
function insightHtml(p){
  const out=[];
  const md=String(p.insightMd||"");
  if(md.trim()) out.push(mdToHtml(md));
  const s=String(p.insight||"");
  if(s.trim()){
    if(/<[a-z]/i.test(s)) out.push(s);                              // 서버가 만든 HTML
    else out.push(looksLikeMd(s)?mdToHtml(s):`<p>${s}</p>`);        // 옛 데이터/샘플
  }
  return out.join("");
}
/* 사이드바용 컴팩트 카드 */
function sideCardHtml(p,cur){
  const t=(p.topics||[]).filter(Boolean)[0];
  return `<a class="scard${cur?" cur":""}" href="#/post/${p.id}">
    <div class="st">${p.title}</div>
    <div class="sm"><span class="who">${p.author||""}</span><span>·</span><span>${fmtDate(p.date)}</span>
      ${t?`<span class="tag ${tagClass(t)}" style="margin-left:auto">${t}</span>`:""}</div></a>`;
}
/* 상세 페이지 우측 1/3 — 위: 최신 기록 3, 아래: 같은 토픽 3 */
function postSideHtml(p){
  const N=3;
  const latest=[...POSTS].sort((a,b)=>String(b.date).localeCompare(String(a.date)))
    .filter(x=>String(x.id)!==String(p.id)).slice(0,N);
  const topics=(p.topics||[]).filter(Boolean);
  const topic=topics[0]||"";
  const related=POSTS.filter(x=>String(x.id)!==String(p.id)
      && (x.topics||[]).filter(Boolean).some(t=>topics.includes(t)))
    .sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,N);
  return `<aside class="post-side">
    <section class="spanel">
      <div class="sh"><h3>최신 기록</h3><span>최근 업데이트 순</span></div>
      <div class="slist">${latest.length?latest.map(x=>sideCardHtml(x)).join(""):`<div class="sempty">아직 다른 글이 없습니다.</div>`}</div>
      <a class="smore" href="#/latest">전체 보기 →</a>
    </section>
    <section class="spanel">
      <div class="sh"><h3>관련 이슈 더보기</h3>${topic?`<span>${topic}</span>`:""}</div>
      <div class="slist">${related.length?related.map(x=>sideCardHtml(x)).join("")
        :`<div class="sempty">${topics.length?"같은 주제의 다른 글이 아직 없습니다.":"이 글에는 주제가 지정되어 있지 않습니다."}</div>`}</div>
      <a class="smore" href="${topic?`#/topic/${encodeURIComponent(topic)}`:"#/topics"}">주제별 보기 →</a>
    </section>
  </aside>`;
}
function viewPost(id){
  const p=POSTS.find(x=>String(x.id)===String(id));
  if(!p) return `<p class="empty">글을 찾을 수 없습니다.</p>`;
  const src=p.source?`<a class="src" href="${p.source}" target="_blank" rel="noopener">🔗 원문 보기</a>`:"";
  return `<div class="back" onclick="history.length>1?history.back():location.hash='#/'">← 목록으로</div>
  <div class="post-layout">
    <div class="post-main">
      ${coverHtml(p)}
      <article class="article">${tagsHtml(p.tags)}
        <h1 class="ptitle">${p.title}</h1>
        <div class="abyline"><span class="byline">${avatarHtml(p.author)}<span class="who">${p.author}</span> · <span>${deriveWeek(p.date).label}</span> · <span>${p.date}</span></span>
${(p.topics||[]).filter(Boolean).map(t=>`<a class="tag ${tagClass(t)} tlink" href="#/topic/${encodeURIComponent(t)}">${t}</a>`).join("")}</div>
        <h4>요약</h4><p class="psum">${fmtSummary(p.summary)}</p>
        <h4>인사이트</h4><div class="insight">${insightHtml(p)}</div>
        ${src}</article>
    </div>
    ${postSideHtml(p)}
  </div>`;
}

/* ---- 라우터 ---- */
function router(){
  const hash=location.hash||"#/";
  const [route,arg]=hash.replace(/^#\//,"").split("/");
  let html,active="home";
  if(!route){html=viewDash();active="dash";}
  else if(route==="latest"){html=viewHome();active="home";}
  else if(route==="weeks"){html=viewWeeks();active="weeks";}
  else if(route==="topics"){html=viewTopics();active="topics";}
  else if(route==="topic"){html=viewTopic(decodeURIComponent(arg||""));active="topics";}
  else if(route==="authors"){html=viewAuthors();active="authors";}
  else if(route==="author"){html=viewAuthor(decodeURIComponent(arg||""));active="authors";}
  else if(route==="post"){html=viewPost(arg);active="";}
  else{html=viewDash();active="dash";}
  $app.innerHTML=html;
  $app.classList.toggle("wide", route==="post");
  document.querySelectorAll(".mh-nav a,.ft-nav a,#topbar .tb-nav a").forEach(a=>a.classList.toggle("active",a.dataset.route===active));
  syncTopbar();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", router);

/* ---- 얇은 고정 줄 ----
   제호가 화면 위로 올라가면 내려오고, 제호가 보이면 다시 숨습니다.
   제호가 없는 화면(최신·주차별 등)에서는 조금만 내려도 나타납니다. */
function syncTopbar(){
  const bar=document.getElementById("topbar"); if(!bar) return;
  const mh=document.querySelector(".masthead");
  /* 제호가 있는 화면(홈)은 제호가 위로 올라갔을 때만 내려옵니다.
     제호가 없는 화면은 워드마크가 여기밖에 없으므로 처음부터 보이게 하고,
     본문이 가리지 않도록 body 에 no-mh 를 붙여 위 여백을 줍니다. */
  document.body.classList.toggle("no-mh", !mh);
  const show = mh ? mh.getBoundingClientRect().bottom <= 4 : true;
  bar.classList.toggle("show", show);
  bar.setAttribute("aria-hidden", show ? "false" : "true");
}
(function(){
  let t=0;
  addEventListener("scroll",function(){ if(!t) t=requestAnimationFrame(function(){t=0;syncTopbar();}); },{passive:true});
  addEventListener("resize",syncTopbar,{passive:true});
  syncTopbar();
})();

/* ---- 데이터 로드 (노션 or 샘플) ----
   /api/posts = 노션에서 데이터를 가져오는 중계 함수 (배포 후 작동).
   로컬에서 파일만 열면 함수가 없어 위 SAMPLE 로 보입니다. */
function applyAuthorMeta(authorsData){
  AUTHORS_META = {};
  (authorsData||[]).forEach(a=>{ if(a && a.name) AUTHORS_META[a.name] = { bio: a.bio || "", about: a.about || "" }; });
  // 노션 작성자 소개 DB가 없거나 비어있고 샘플 모드면 예시 소개 사용
  if(USING_SAMPLE && Object.keys(AUTHORS_META).length===0){
    for(const k in SAMPLE_AUTHORS) AUTHORS_META[k] = { bio: SAMPLE_AUTHORS[k] };
  }
}
function loadData(){
  $app.innerHTML=`<div class="loading"><div class="spinner"></div>데이터를 불러오는 중…</div>`;
  Promise.all([
    fetch("/api/posts").then(r=>{ if(!r.ok) throw new Error("no api"); return r.json(); }).catch(()=>null),
    fetch("/api/authors").then(r=> r.ok ? r.json() : []).catch(()=>[])
  ]).then(([data, authorsData])=>{
    if(Array.isArray(data) && data.length){ POSTS=data; USING_SAMPLE=false; }
    else { POSTS=SAMPLE; USING_SAMPLE=true; }
    applyAuthorMeta(authorsData);
    router();
  });
}
loadData();


/* ---- 커서 (주황 점 → 링) ----
   마우스가 있는 기기에서만 켜집니다. 잔상·자석 효과 같은 건 넣지 않았습니다. */
(function(){
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  var el=document.createElement("div");
  el.id="cur"; el.setAttribute("aria-hidden","true"); el.innerHTML="<i></i>";
  document.body.appendChild(el);
  // 누를 수 있는 것들. 이 사이트의 카드·탭은 대부분 onclick 을 달고 있습니다.
  var HIT='a,button,[onclick],[role="button"],label,summary';
  var x=0,y=0,raf=0;
  function draw(){ raf=0; el.style.transform="translate3d("+x+"px,"+y+"px,0)"; }
  addEventListener("mousemove",function(e){
    x=e.clientX; y=e.clientY;
    if(!raf) raf=requestAnimationFrame(draw);
    var t=e.target;
    // 다른 문서가 들어간 자리(iframe) 위에서는 좌표가 전달되지 않으므로 기본 커서로 넘깁니다
    if(t.closest && t.closest("iframe")){ el.classList.remove("on"); return; }
    el.classList.add("on");
    el.classList.toggle("ring", !!(t.closest && t.closest(HIT)));
  },{passive:true});
  addEventListener("mousedown",function(){ el.classList.add("press"); },{passive:true});
  addEventListener("mouseup",function(){ el.classList.remove("press"); },{passive:true});
  document.addEventListener("mouseleave",function(){ el.classList.remove("on"); });
  addEventListener("blur",function(){ el.classList.remove("on","press"); });
})();
</script>
