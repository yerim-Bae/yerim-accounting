<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Move · 운동 기록 — Yerim's House</title>
<meta name="description" content="5KM·10KM 마라톤과 테니스. 배예림의 운동 기록." />
<!-- 아직 프로토타입에서만 연결되는 페이지라 색인에서 뺍니다. 정식 공개 때 이 줄만 지우면 됩니다. -->
<meta name="robots" content="noindex" />

<link rel="icon" href="favicon.ico?v=8" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=8" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png?v=8" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

<style>
  /* =====================================================================
     Move — 운동 기록

     빨랫줄에 폴라로이드를 집게로 널어둔 화면입니다.
     · 줄은 폴라로이드 뒤로 지나가고, 집게가 줄 위에 걸립니다.
     · 카드마다 각도가 조금씩 달라 널어둔 느낌이 납니다.
     · 배경·글자색·글꼴은 사이트 기존 값 그대로입니다.
       참고한 사진에서 가져온 것은 배치와 집게·그림자 같은 형태뿐입니다.
     ===================================================================== */
  :root{
    --ivory:#F5F1EB;
    --ivory-2:#EFEAE2;
    --ink:#1C1A19;
    --ink-60:rgba(28,26,25,.60);
    --ink-40:rgba(28,26,25,.40);
    --ink-14:rgba(28,26,25,.14);
    --ink-08:rgba(28,26,25,.08);
    --orange:#D8662F;
    --serif:"Noto Serif KR",serif;
    --sans:"Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;
    /* 집게 나무색 — 사이트의 따뜻한 계열 안에서 골랐습니다 */
    --peg-1:#E4C79C; --peg-2:#D2AB79; --peg-3:#BE9260;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{background:var(--ivory);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;
    overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{max-width:100%}
  .wr-wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 clamp(18px,3vw,36px)}

  /* ---- 머리 ---- */
  .wr-top{padding:clamp(22px,3vw,34px) 0;display:flex;align-items:center;gap:18px}
  .wr-back{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);transition:color .18s ease}
  .wr-back i{font-style:normal;color:var(--orange);transition:transform .18s cubic-bezier(.22,1,.36,1)}
  .wr-back:hover,.wr-back:focus-visible{color:var(--orange)}
  .wr-back:hover i,.wr-back:focus-visible i{transform:translateX(-4px)}
  .wr-mark{margin-left:auto}
  .wr-mark img{display:block;height:20px;width:auto;transition:opacity .18s ease}
  .wr-mark:hover img{opacity:.78}

  .wr-head{padding:clamp(10px,2vw,22px) 0 clamp(26px,4vw,44px)}
  .wr-title{font-family:var(--sans);font-weight:900;text-transform:uppercase;
    font-size:clamp(34px,7vw,96px);line-height:.9;letter-spacing:-.038em}
  .wr-title em{font-style:normal;color:var(--orange)}
  .wr-lede{margin-top:clamp(16px,2vw,24px);max-width:36em;
    font-size:clamp(13.5px,1.35vw,15.5px);line-height:1.85;color:var(--ink-60)}

  /* =====================================================================
     빨랫줄 한 줄
     ===================================================================== */
  .wr-set{padding-bottom:clamp(40px,6vw,76px)}
  .wr-label{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:34px}
  .wr-label h2{font-family:var(--serif);font-size:clamp(17px,2vw,23px);font-weight:600;
    letter-spacing:-.025em}
  .wr-label .wr-date{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.1em;
    color:var(--ink-40);font-variant-numeric:tabular-nums}
  .wr-label .wr-note{font-size:12.5px;color:var(--ink-40)}

  /* 줄 — 화면 끝까지 뻗고, 폴라로이드 뒤로 지나갑니다 */
  .wr-line{position:relative}
  .wr-line::before{content:"";position:absolute;left:calc(-1 * clamp(18px,3vw,36px));
    right:calc(-1 * clamp(18px,3vw,36px));top:0;height:1.5px;background:var(--ink);z-index:0}

  /* 카드 윗부분이 줄 위로 18px 올라와, 줄이 카드 뒤를 지나가는 모양이 됩니다 */
  .wr-pins{position:relative;z-index:1;display:flex;flex-wrap:wrap;
    gap:clamp(16px,7vw,110px);align-items:flex-start;margin-top:-18px}

  .wr-pin{position:relative;margin:0;flex:0 0 auto;
    width:clamp(146px,22vw,300px)}
  /* 폴라로이드 — 흰 인화지, 아래쪽 여백이 넓고, 아주 옅은 그림자 */
  .wr-card{display:block;background:#FFFDFA;padding:10px 10px 0;
    border:1px solid rgba(28,26,25,.08);
    box-shadow:0 8px 16px rgba(28,26,25,.10), 0 1px 3px rgba(28,26,25,.08);
    transform:rotate(var(--tilt,0deg));transform-origin:50% 0}
  .wr-card img{display:block;width:100%;height:auto}
  .wr-card .is-wide{aspect-ratio:3/4;object-fit:contain;background:#FFFDFA}
  .wr-cap{display:block;padding:13px 6px 15px;text-align:center;
    font-family:var(--serif);font-size:13px;line-height:1.4;letter-spacing:-.01em;color:var(--ink-60)}
  .wr-cap b{display:block;font-weight:600;color:var(--ink);letter-spacing:0}

  /* 집게 — 줄에 물린 나무 집게. 카드와 같은 각도로 함께 기울어집니다. */
  .wr-peg{position:absolute;left:50%;top:0;z-index:2;
    width:13px;height:32px;border-radius:3px;
    background:linear-gradient(180deg,var(--peg-1) 0%,var(--peg-2) 58%,var(--peg-3) 100%);
    box-shadow:0 2px 4px rgba(28,26,25,.28);
    transform:translateX(-50%) rotate(var(--tilt,0deg));transform-origin:50% 0}
  .wr-peg::before{content:"";position:absolute;left:-1px;right:-1px;top:15px;height:2px;
    background:rgba(28,26,25,.30)}
  .wr-peg::after{content:"";position:absolute;left:50%;top:5px;width:1px;height:22px;
    margin-left:-.5px;background:rgba(28,26,25,.16)}

  /* ---- 바닥 ---- */
  .wr-foot{padding:clamp(28px,4vw,44px) 0 clamp(40px,6vw,64px);border-top:1px solid var(--ink-14);
    display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;
    font-size:12.5px;color:var(--ink-40)}
  .wr-foot a{font-weight:600;color:var(--ink-60);transition:color .2s ease}
  .wr-foot a:hover,.wr-foot a:focus-visible{color:var(--orange)}

  :focus-visible{outline:2px solid var(--orange);outline-offset:3px}

  @media(max-width:640px){
    .wr-pins{gap:14px}
    .wr-pin{width:calc((100% - 14px) / 2)}
    .wr-card{padding:7px 7px 0}
    .wr-cap{font-size:11.5px;padding:10px 4px 12px}
    .wr-peg{width:11px;height:26px}
    .wr-peg::before{top:12px}
    .wr-peg::after{height:17px}
    .wr-label .wr-date{margin-left:0;width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<header class="wr-wrap wr-top">
  <a class="wr-back" href="index-snap-prototype.html#move"><i aria-hidden="true">←</i>Yerim's House</a>
  <a class="wr-mark" href="index-snap-prototype.html" aria-label="Yerim's House 첫 화면으로">
    <img src="assets/wordmark-mark.png?v=1" alt="Yerim" width="167" height="96" />
  </a>
</header>

<main class="wr-wrap">

  <div class="wr-head">
    <h1 class="wr-title"><em>03</em> Move</h1>
    <p class="wr-lede">
      5KM와 10KM 마라톤, 그리고 테니스 대회까지.
      목표를 정하고, 과정을 남기고, 다음 목표를 세웁니다.
    </p>
  </div>

  <!-- 5KM 마라톤 --------------------------------------------------------- -->
  <section class="wr-set" aria-labelledby="wr5k">
    <div class="wr-label">
      <h2 id="wr5k">5KM 마라톤</h2>
      <span class="wr-note">첫 완주</span>
      <span class="wr-date">2024.03.03</span>
    </div>
    <div class="wr-line">
      <div class="wr-pins">
        <figure class="wr-pin" style="--tilt:-3deg">
          <span class="wr-card">
            <img src="assets/move/5k-bib.jpg" alt="5KM 마라톤 참가 배번호" width="600" height="800" />
            <span class="wr-cap"><b>번호</b>배번호</span>
          </span>
          <span class="wr-peg" aria-hidden="true"></span>
        </figure>
        <figure class="wr-pin" style="--tilt:2.2deg">
          <span class="wr-card">
            <img src="assets/move/5k-record.jpg" alt="5KM 달리기 기록 — 33분 47초, 6.31km" width="600" height="800" />
            <span class="wr-cap"><b>기록</b>0:33:47 · 6.31km</span>
          </span>
          <span class="wr-peg" aria-hidden="true"></span>
        </figure>
      </div>
    </div>
  </section>

  <!-- 10KM 마라톤 -------------------------------------------------------- -->
  <section class="wr-set" aria-labelledby="wr10k">
    <div class="wr-label">
      <h2 id="wr10k">10KM 마라톤</h2>
      <span class="wr-note">여의도공원</span>
      <span class="wr-date">2025.10.26</span>
    </div>
    <div class="wr-line">
      <div class="wr-pins">
        <figure class="wr-pin" style="--tilt:2.6deg">
          <span class="wr-card">
            <img class="is-wide" src="assets/move/10k-record.jpg" alt="10KM 챌린지 기록 — 1시간 15분" width="800" height="600" />
            <span class="wr-cap"><b>기록</b>01:15:00</span>
          </span>
          <span class="wr-peg" aria-hidden="true"></span>
        </figure>
        <figure class="wr-pin" style="--tilt:-2.4deg">
          <span class="wr-card">
            <img src="assets/move/10k-proof.jpg" alt="10KM 마라톤 완주 인증샷" width="600" height="800" />
            <span class="wr-cap"><b>인증샷</b>완주</span>
          </span>
          <span class="wr-peg" aria-hidden="true"></span>
        </figure>
      </div>
    </div>
  </section>

  <!-- 테니스 ------------------------------------------------------------- -->
  <section class="wr-set" aria-labelledby="wrten">
    <div class="wr-label">
      <h2 id="wrten">테니스</h2>
      <span class="wr-note">동아리 여자복식</span>
      <span class="wr-date">2025.11.01</span>
    </div>
    <div class="wr-line">
      <div class="wr-pins">
        <figure class="wr-pin" style="--tilt:-1.8deg">
          <span class="wr-card">
            <img src="assets/move/tennis-racket.jpg" alt="테니스 라켓과 운동화" width="600" height="800" />
            <span class="wr-cap"><b>라켓</b>대회 준비</span>
          </span>
          <span class="wr-peg" aria-hidden="true"></span>
        </figure>
        <figure class="wr-pin" style="--tilt:3deg">
          <span class="wr-card">
            <img src="assets/move/tennis-win.jpg" alt="테니스 동아리 여자복식 우승" width="600" height="800" />
            <span class="wr-cap"><b>우승</b>여자복식</span>
          </span>
          <span class="wr-peg" aria-hidden="true"></span>
        </figure>
      </div>
    </div>
  </section>

</main>

</body>
