<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workout · 운동 기록 — Yerim's House</title>
<meta name="description" content="5KM·10KM 마라톤과 테니스. 배예림의 운동 기록." />
<link rel="icon" href="favicon.ico?v=8" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=8" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png?v=8" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

<style>
  /* =====================================================================
     Move — 운동 기록

     폴라로이드를 주황 테이프로 붙여둔 화면입니다.
     · 테이프는 카드 윗변에 반쯤 걸치고, 카드와 다른 각도로 붙습니다.
     · 카드마다 높이(--drop)와 기울기(--tilt)가 조금씩 달라 손으로 붙인
       느낌이 나되, 줄이 흐트러져 보이지 않을 만큼만 어긋납니다.
     · 배경·글자색·글꼴은 사이트 기존 값 그대로입니다.
       테이프 색도 사이트 주황(--orange)을 반투명으로 쓴 것입니다.
     ===================================================================== */
  :root{
    --ivory:#F5F1EB;
    --ivory-2:#EFEAE2;
    --ink:#1C1A19;
    --ink-60:rgba(28,26,25,.60);
    --ink-40:rgba(28,26,25,.40);
    --ink-14:rgba(28,26,25,.14);
    --ink-08:rgba(28,26,25,.08);
    --orange:#D8662F;
    --serif:"Noto Serif KR",serif;
    --sans:"Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{background:var(--ivory);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;
    overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{max-width:100%}
  .wr-wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 clamp(18px,3vw,36px)}

  /* ---- 머리 ----
     화면 왼쪽 위 워드마크가 Move 장면으로 돌아가는 길입니다.
     (Study Log 제호 왼쪽에 쓰는 것과 같은, 화살표가 붙은 워드마크입니다) */
  /* 워드마크는 가운데 지면이 아니라 화면 왼쪽 끝에 붙입니다 */
  .wr-top{max-width:none;margin:0;padding:clamp(18px,2.4vw,28px) clamp(18px,3vw,36px)}
  .wr-back{display:inline-flex;align-items:center;
    transition:transform .18s cubic-bezier(.22,1,.36,1),opacity .18s ease}
  .wr-back img{display:block;height:26px;width:auto}
  .wr-back:hover,.wr-back:focus-visible{transform:translateX(-4px);opacity:.85}
  @media(max-width:640px){ .wr-back img{height:22px} }

  .wr-head{padding:clamp(10px,2vw,22px) 0 clamp(26px,4vw,44px)}
  .wr-title{font-family:var(--sans);font-weight:900;text-transform:uppercase;
    font-size:clamp(34px,7vw,96px);line-height:.9;letter-spacing:-.038em}
  .wr-title em{font-style:normal;color:var(--orange)}
  .wr-lede{margin-top:clamp(16px,2vw,24px);max-width:36em;
    font-size:clamp(13.5px,1.35vw,15.5px);line-height:1.85;color:var(--ink-60)}

  /* =====================================================================
     테이프로 붙인 폴라로이드
     ===================================================================== */
  .wr-set{padding-bottom:clamp(40px,6vw,76px)}
  .wr-label{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:34px}
  .wr-label h2{font-family:var(--serif);font-size:clamp(17px,2vw,23px);font-weight:600;
    letter-spacing:-.025em}
  .wr-label .wr-date{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.1em;
    color:var(--ink-40);font-variant-numeric:tabular-nums}
  .wr-label .wr-note{font-size:12.5px;color:var(--ink-40)}

  /* --g 는 카드 사이 간격. 한 줄에 몇 장을 붙일지에 따라 폭 계산에 함께 씁니다. */
  .wr-pins{--g:clamp(10px,1.5vw,22px);
    position:relative;display:flex;flex-wrap:wrap;
    gap:var(--g);align-items:flex-start;padding-top:14px}

  /* 넓은 화면 — 여섯 장을 한 줄에.
     --drop 으로 카드마다 높이를 조금씩 어긋나게 둡니다(최대 26px). */
  .wr-pin{position:relative;margin:0;flex:0 0 calc((100% - 5 * var(--g)) / 6);
    margin-top:var(--drop,0px)}
  /* 폴라로이드 — 흰 인화지, 아래쪽 여백이 넓고, 아주 옅은 그림자 */
  .wr-card{display:block;background:#FFFDFA;padding:10px 10px 0;
    border:1px solid rgba(28,26,25,.08);
    box-shadow:0 8px 16px rgba(28,26,25,.10), 0 1px 3px rgba(28,26,25,.08);
    transform:rotate(var(--tilt,0deg));transform-origin:50% 0}
  .wr-card img{display:block;width:100%;height:auto}
  .wr-card .is-wide{aspect-ratio:3/4;object-fit:contain;background:#FFFDFA}
  .wr-cap{display:block;padding:13px 6px 15px;text-align:center;
    font-family:var(--serif);font-size:13px;line-height:1.4;letter-spacing:-.01em;color:var(--ink-60)}
  .wr-cap b{display:block;font-weight:600;color:var(--ink);letter-spacing:0}

  /* 테이프 — 카드 윗변에 반쯤 걸쳐 붙입니다.
     카드와 다른 각도로 붙어야 손으로 붙인 느낌이 나므로 카드 회전을 따라가지
     않게 .wr-card 바깥에 두었습니다.
     mix-blend-mode:multiply 라 아래에 있는 인화지와 배경이 비쳐 보입니다. */
  .wr-tape{position:absolute;left:50%;top:0;z-index:2;
    width:clamp(40px,30%,74px);height:20px;
    background:linear-gradient(180deg,rgba(216,102,47,.60) 0%,rgba(216,102,47,.44) 100%);
    mix-blend-mode:multiply;
    transform:translate(-50%,-45%) rotate(var(--tape,-6deg))}
  /* 결이 살짝 보이게 — 화지 테이프 느낌 */
  .wr-tape::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 2px,transparent 2px 7px)}
  /* 위아래 가장자리를 조금 진하게 */
  .wr-tape::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;
    border-top:1px solid rgba(216,102,47,.22);border-bottom:1px solid rgba(216,102,47,.22)}

  /* ---- 바닥 ---- */
  .wr-foot{padding:clamp(28px,4vw,44px) 0 clamp(40px,6vw,64px);border-top:1px solid var(--ink-14);
    display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;
    font-size:12.5px;color:var(--ink-40)}
  .wr-foot a{font-weight:600;color:var(--ink-60);transition:color .2s ease}
  .wr-foot a:hover,.wr-foot a:focus-visible{color:var(--orange)}

  :focus-visible{outline:2px solid var(--orange);outline-offset:3px}

  @media(max-width:900px){
    /* 한 줄에 셋씩 두 줄 */
    .wr-pin{flex:0 0 calc((100% - 2 * var(--g)) / 3)}
    .wr-card{padding:8px 8px 0}
  }
  @media(max-width:640px){
    /* 한 줄에 둘씩 세 줄 */
    .wr-pin{flex:0 0 calc((100% - var(--g)) / 2)}
    .wr-card{padding:7px 7px 0}
    .wr-cap{font-size:11.5px;padding:10px 4px 12px}
    .wr-tape{height:16px}
    .wr-label .wr-date{margin-left:0;width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<header class="wr-wrap wr-top">
  <a class="wr-back" href="index.html#workout" aria-label="Workout 장면으로 돌아가기">
    <img src="assets/wordmark.png?v=1" alt="Yerim" width="220" height="96" />
  </a>
</header>

<main class="wr-wrap">

  <div class="wr-head">
    <h1 class="wr-title"><em>02</em> Workout</h1>
    <p class="wr-lede">
      5KM와 10KM 마라톤, 그리고 테니스 대회까지.
      목표를 정하고, 과정을 남기고, 다음 목표를 세웁니다.
    </p>
  </div>

  <!-- 여섯 장을 나란히 붙입니다. 왼쪽부터 5KM → 10KM → 테니스 순서입니다. -->
  <section class="wr-set" aria-labelledby="wrRec">
    <div class="wr-label">
      <h2 id="wrRec">기록</h2>
      <span class="wr-note">5KM · 10KM · Tennis</span>
      <span class="wr-date">2024.03.03 — 2025.11.01</span>
    </div>
      <div class="wr-pins">

        <figure class="wr-pin" style="--tilt:-3deg;--drop:0px;--tape:-7deg">
          <span class="wr-card">
            <img src="assets/move/5k-bib.jpg" alt="5KM 마라톤 참가 배번호" width="600" height="800" />
            <span class="wr-cap"><b>5KM 마라톤</b>번호 · 2024.03.03</span>
          </span>
          <span class="wr-tape" aria-hidden="true"></span>
        </figure>

        <figure class="wr-pin" style="--tilt:2.2deg;--drop:20px;--tape:5deg">
          <span class="wr-card">
            <img src="assets/move/5k-record.jpg" alt="5KM 달리기 기록 — 33분 47초, 6.31km" width="600" height="800" />
            <span class="wr-cap"><b>5KM 마라톤</b>기록 0:33:47</span>
          </span>
          <span class="wr-tape" aria-hidden="true"></span>
        </figure>

        <figure class="wr-pin" style="--tilt:-1.6deg;--drop:7px;--tape:-4deg">
          <span class="wr-card">
            <img class="is-wide" src="assets/move/10k-record.jpg" alt="10KM 챌린지 기록 — 1시간 15분" width="800" height="600" />
            <span class="wr-cap"><b>10KM 마라톤</b>기록 01:15:00</span>
          </span>
          <span class="wr-tape" aria-hidden="true"></span>
        </figure>

        <figure class="wr-pin" style="--tilt:2.6deg;--drop:26px;--tape:8deg">
          <span class="wr-card">
            <img src="assets/move/10k-proof.jpg" alt="10KM 마라톤 완주 인증샷" width="600" height="800" />
            <span class="wr-cap"><b>10KM 마라톤</b>인증샷 · 2025.10.26</span>
          </span>
          <span class="wr-tape" aria-hidden="true"></span>
        </figure>

        <figure class="wr-pin" style="--tilt:-2.2deg;--drop:11px;--tape:-6deg">
          <span class="wr-card">
            <img src="assets/move/tennis-racket.jpg" alt="테니스 라켓과 운동화" width="600" height="800" />
            <span class="wr-cap"><b>테니스</b>라켓 · 대회 준비</span>
          </span>
          <span class="wr-tape" aria-hidden="true"></span>
        </figure>

        <figure class="wr-pin" style="--tilt:3deg;--drop:22px;--tape:6deg">
          <span class="wr-card">
            <img src="assets/move/tennis-win.jpg" alt="테니스 동아리 여자복식 우승" width="600" height="800" />
            <span class="wr-cap"><b>테니스</b>우승 · 2025.11.01</span>
          </span>
          <span class="wr-tape" aria-hidden="true"></span>
        </figure>

    </div>
  </section>

</main>

<footer class="wr-wrap wr-foot">
  <span>© 2026 배예림 · Yerim Bae</span>
  <a href="index.html#workout">← Workout 으로 돌아가기</a>
  <a href="archive.html">Study Log</a>
</footer>

</body>
</html>
